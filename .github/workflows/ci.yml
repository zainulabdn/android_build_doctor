name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart run tool/embed_data.dart
      - name: Embedded data is up to date
        run: git diff --exit-code lib/src/data/bundled_data.dart
        shell: bash
      - run: dart test
      - name: Smoke test the CLI
        run: dart run bin/android_build_doctor.dart --offline --no-commands --project test/fixtures/projects/healthy_347 check
      - run: dart pub publish --dry-run
        if: matrix.os == 'ubuntu-latest'
